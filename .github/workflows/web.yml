name: Build web e pubblica su Pages

# Impacchetta il gioco in WebAssembly con pygbag e lo pubblica su GitHub Pages,
# cosi' si apre da Safari sull'iPad. La build va fatta qui e non in locale
# perche' pygbag scarica il runtime CPython-WASM da pygame-web.github.io.

# Spenta: il gioco si usa con l'eseguibile per Windows, e la versione per il
# browser non si pubblica piu' a ogni push. Resta qui intera: per riaccenderla
# basta avviarla a mano da Actions ("Run workflow"), oppure rimettere il blocco
# `push` qui sotto.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install pygbag==0.9.3

      - name: Prepara i sorgenti da impacchettare
        # solo codice, dati e i caratteri: gli screenshot peserebbero sul
        # download. I font viaggiano col gioco perche' nel browser non c'e'
        # nessun font di sistema da chiedere
        run: |
          mkdir -p stage/apex-manager
          cp -r main.py game data assets stage/apex-manager/
          find stage -name __pycache__ -type d -exec rm -rf {} + || true
          # la sigla della build: si legge nel menu del gioco, e dice a colpo
          # d'occhio se quello che si sta guardando e' l'ultima versione o una
          # copia rimasta nella cache del browser
          git log -1 --format='%h %cd' --date=format:'%d/%m %H:%M' \
            > stage/apex-manager/data/build.txt
          cat stage/apex-manager/data/build.txt

      - name: Build WebAssembly
        # width/height devono combaciare con il set_mode del gioco, altrimenti
        # la canvas della pagina resta di un'altra misura e non mostra nulla.
        # Niente --ume_block 0: su iOS Safari conviene tenere la schermata di
        # avvio, perche' garantisce un tocco dell'utente prima di partire
        run: >
          python -m pygbag --build --width 1600 --height 900
          --title "Apex Manager" stage/apex-manager/main.py

      - name: Controlla che il runtime sia stato scaricato
        run: |
          test -f stage/apex-manager/build/web/index.html
          ls -la stage/apex-manager/build/web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stage/apex-manager/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
